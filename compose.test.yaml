# Standalone test stack: no host ports and no access to development data.
services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: catalog_test
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    volumes:
      - test-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog_test"]
      interval: 1s
      timeout: 3s
      retries: 60
  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://catalog:catalog@postgres:5432/catalog_test?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgres://catalog:catalog@postgres:5432/catalog_test?sslmode=disable
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 15s
  integration:
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgres://catalog:catalog@postgres:5432/catalog_test?sslmode=disable
    command: ["go", "test", "-tags=integration", "-race", "-count=1", "-v", "./internal/postgres"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  e2e:
    build:
      context: .
      target: test
    environment:
      E2E_BASE_URL: http://api:8080
      E2E_PHASE: normal
    command: ["go", "test", "-tags=e2e", "-count=1", "-v", "./tests/e2e"]
    depends_on:
      api:
        condition: service_started
volumes:
  test-data:

services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    image: migrate/migrate:v4.20.1
    volumes:
      - ./migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://catalog:catalog@postgres:5432/catalog?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgres://catalog:catalog@postgres:5432/catalog?sslmode=disable
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 15s
volumes:
  catalog-data:
